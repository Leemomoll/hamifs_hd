server:
  # 服务监听端口：容器内外统一 8080，宿主机映射由 docker-compose 控制
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发默认 localhost；Docker 环境由 compose 注入 MYSQL_HOST=hamifs-mysql
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hamifs}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hamifs.entity
  configuration:
    map-underscore-to-camel-case: true

# 自定义 JWT 配置
jwt:
  # 256 位以上密钥，生产必须通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:hamifs-jwt-secret-key-please-change-in-prod-32bytes-min!!}
  # 默认 accessToken 有效期（秒）= 2 小时
  expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  # 记住我有效期（秒）= 7 天
  remember-me-seconds: ${JWT_REMEMBER_ME_SECONDS:604800}
  # 请求头名称
  header: Authorization
  # Token 前缀
  token-prefix: "Bearer "
  # JWT 签发者
  issuer: hamifs-back